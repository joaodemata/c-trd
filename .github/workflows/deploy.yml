# Despliega en el VPS cada push a una rama de entorno. Corre en el runner self-hosted del VPS.
# Solo se usa "push": nunca agregar pull_request aqui, un fork podria ejecutar codigo en el servidor
name: Deploy

on:
  push:
    branches: [develop, qa, sandbox, production]

# Un despliegue a la vez por rama; uno nuevo cancela el anterior que siga en cola
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ctrd-vps]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Resolver entorno
        run: |
          case "${GITHUB_REF_NAME}" in
            develop)    env=dev ;;
            qa)         env=qa ;;
            sandbox)    env=sandbox ;;
            production) env=prod ;;
            *) echo "Rama sin entorno: ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "SERVICE=ctrd-${env}" >> "$GITHUB_ENV"
          echo "ENV_NAME=${env}" >> "$GITHUB_ENV"

      # La imagen corre go vet y go test; si fallan, el despliegue se detiene aqui
      - name: Construir imagen
        run: docker compose build "$SERVICE"

      - name: Levantar servicio
        run: docker compose up -d "$SERVICE" caddy

      - name: Recargar Caddy
        run: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

      # El cron del host ejecuta los agentes los viernes con Claude Code; aqui solo se publica el binario de esta rama.
      # Si /opt/ctrd/agents no esta preparado (ver deploy/README.md) solo se avisa, el despliegue de la API no falla
      - name: Publicar runner de los agentes
        run: |
          if [ ! -w /opt/ctrd/agents ]; then
            echo "::warning::/opt/ctrd/agents no existe o no es escribible, no se publica el runner de los agentes"
            exit 0
          fi
          mkdir -p /opt/ctrd/agents/bin
          docker compose cp "$SERVICE:/app/agent_runner" "/opt/ctrd/agents/bin/agent_runner-${ENV_NAME}.new"
          chmod 755 "/opt/ctrd/agents/bin/agent_runner-${ENV_NAME}.new"
          mv "/opt/ctrd/agents/bin/agent_runner-${ENV_NAME}.new" "/opt/ctrd/agents/bin/agent_runner-${ENV_NAME}"
          install -m 755 agents/run_agents.sh /opt/ctrd/agents/run_agents.sh

      - name: Limpiar imagenes viejas
        run: docker image prune -f
