# Nombre fijo del proyecto: los volumenes (datos de Mongo, certificados) sobreviven entre despliegues
name: ctrd

# Configuracion comun de los 4 entornos de la API
x-ctrd: &ctrd
  build:
    context: ..
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  networks:
    - internal

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # Replica set de un nodo (rs0): las transacciones no funcionan en una instancia standalone.
    # Con autenticacion activa, un replica set exige keyFile
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile"]
    env_file: /opt/ctrd/env/mongo.env
    volumes:
      - mongo-data:/data/db
      # Creado en el VPS por scripts/generate_env_files.ps1 (dueño 999, permisos 400)
      - /opt/ctrd/mongo/keyfile:/etc/mongo/keyfile:ro
    # Inicia el replica set la primera vez (idempotente) y solo queda healthy cuando es PRIMARY.
    # El host "mongo:27017" es el que los contenedores de la API resuelven en la red interna
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    # Solo accesible desde el propio VPS (o por tunel SSH), nunca desde internet
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - internal

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: /opt/ctrd/env/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Se monta la carpeta (no el archivo) para que un git checkout nuevo se vea al recargar
      - ./caddy:/etc/caddy:ro
      # Build del frontend F-CTRD, una carpeta por entorno
      - /opt/ctrd/web:/srv/f-ctrd:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

  ctrd-dev:
    <<: *ctrd
    image: ctrd:dev
    env_file: /opt/ctrd/env/dev.env
    volumes:
      - trends-dev:/app/data/google_trends

  ctrd-qa:
    <<: *ctrd
    image: ctrd:qa
    env_file: /opt/ctrd/env/qa.env
    volumes:
      - trends-qa:/app/data/google_trends

  ctrd-sandbox:
    <<: *ctrd
    image: ctrd:sandbox
    env_file: /opt/ctrd/env/sandbox.env
    volumes:
      - trends-sandbox:/app/data/google_trends

  ctrd-prod:
    <<: *ctrd
    image: ctrd:prod
    env_file: /opt/ctrd/env/prod.env
    volumes:
      - trends-prod:/app/data/google_trends

networks:
  internal:

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
  trends-dev:
  trends-qa:
  trends-sandbox:
  trends-prod:
